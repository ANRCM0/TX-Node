name: CI

on:
  push:
    branches: [main, master, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  # 手动触发：Actions 页 Run workflow，可选是否更新 latest 镜像标签
  workflow_dispatch:
    inputs:
      push_latest:
        description: '同时更新 latest 镜像标签'
        type: boolean
        default: true

# 同一分支的连续 push 自动取消过期的 run，只跑最新提交
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test

      - name: Enforce legacy retirement boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -d cmd/xbctl
          legacy_xboard_artifact="xboard-node""-linux-"
          legacy_xbctl_artifact="xbctl""-linux-"
          legacy_docker_alias="xboard-node"":latest"
          if grep -Fq "$legacy_xboard_artifact" Makefile .github/workflows/ci.yml; then
            echo "legacy xboard-node release artifact was reintroduced" >&2
            exit 1
          fi
          if grep -Fq "$legacy_xbctl_artifact" Makefile .github/workflows/ci.yml; then
            echo "legacy xbctl release artifact was reintroduced" >&2
            exit 1
          fi
          if grep -Fq "$legacy_docker_alias" Makefile Dockerfile; then
            echo "legacy xboard-node Docker alias was reintroduced" >&2
            exit 1
          fi
          grep -Fq 'CMD ["-c", "/etc/txnode/config.yml"]' Dockerfile

  container-config-path:
    name: Container config path compatibility
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build -t tx-node:config-path-ci .

      - name: Verify canonical image command
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect tx-node:config-path-ci --format '{{json .Config.Cmd}}')" = '["-c","/etc/txnode/config.yml"]'

      - name: Verify old Compose mount fallback
        shell: bash
        run: |
          set -euo pipefail
          legacy_cfg="$(mktemp)"
          printf 'invalid: [\n' > "$legacy_cfg"
          output="$(docker run --rm -v "$legacy_cfg:/etc/xboard-node/config.yml:ro" tx-node:config-path-ci 2>&1 || true)"
          printf '%s\n' "$output"
          grep -Fq 'using legacy container config path /etc/xboard-node/config.yml' <<<"$output"

      - name: Verify canonical path wins
        shell: bash
        run: |
          set -euo pipefail
          canonical_cfg="$(mktemp)"
          legacy_cfg="$(mktemp)"
          printf 'invalid: [\n' > "$canonical_cfg"
          printf 'invalid: [\n' > "$legacy_cfg"
          output="$(docker run --rm \
            -v "$canonical_cfg:/etc/txnode/config.yml:ro" \
            -v "$legacy_cfg:/etc/xboard-node/config.yml:ro" \
            tx-node:config-path-ci 2>&1 || true)"
          printf '%s\n' "$output"
          if grep -Fq 'using legacy container config path' <<<"$output"; then
            echo "legacy fallback won despite canonical config being mounted" >&2
            exit 1
          fi

  runtime-stability:
    name: Runtime stability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Stress extracted runtime controllers
        run: make test-runtime-stability

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    # 仅手动触发或打 tag 才构建二进制（push 只跑 test）
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        run: |
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            make build-linux
          else
            make build-linux-arm64
          fi

      - name: Upload tx-node artifact
        uses: actions/upload-artifact@v4
        with:
          name: tx-node-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tx-node-${{ matrix.goos }}-${{ matrix.goarch }}

  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    # 仅手动触发或打 tag 才推镜像
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo name (GHCR requires lowercase)
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # GHA 构建缓存：QEMU arm64 编译第二次起显著提速；
          # mode=max 缓存所有构建阶段（含 go mod download / 编译中间层）
          cache-from: type=gha,scope=txnode
          cache-to: type=gha,mode=max,scope=txnode
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
            ${{ (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' && github.event.inputs.push_latest == 'true') && format('ghcr.io/{0}:latest', steps.repo.outputs.name) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}:{1}', steps.repo.outputs.name, github.ref_name) || '' }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          make_latest: true
          files: |
            dist/tx-node-linux-amd64
            dist/tx-node-linux-arm64
