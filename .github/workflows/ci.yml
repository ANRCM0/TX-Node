name: CI

on:
  push:
    branches: [main, master, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  # 手动运行 main：只发布 :test 和提交 SHA 镜像，不覆盖正式 :latest
  workflow_dispatch:

# 同一分支的连续 push 自动取消过期的 run，只跑最新提交
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify canonical Go module and source paths
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'module github.com/ANRCM0/TX-Node' go.mod
          if grep -RFn 'github.com/PaiMonCai/TX-Node' cmd internal Makefile Dockerfile go.mod; then
            echo "Legacy TX-Node module path has reappeared in runtime sources or build metadata" >&2
            exit 1
          fi
          if grep -Fq 'ghcr.io/paimoncai/tx-node' Dockerfile; then
            echo "Legacy TX-Node registry location has reappeared in the Dockerfile" >&2
            exit 1
          fi
          go mod verify

      - name: Enforce ANRCM0-owned kernel dependencies
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^replace github.com/sagernet/sing-box => github.com/ANRCM0/sing-box v' go.mod
          grep -Eq '^replace github.com/xtls/xray-core => github.com/ANRCM0/Xray-core v' go.mod
          if grep -E 'github.com/PaiMonCai/(sing-box|Xray-core)' go.mod go.sum; then
            echo "Old-account kernel fork dependency has reappeared" >&2
            exit 1
          fi
          grep -Eq '^github.com/ANRCM0/sing-box v[^ ]+ h1:' go.sum
          grep -Eq '^github.com/ANRCM0/Xray-core v[^ ]+ h1:' go.sum
          go mod tidy -diff

      - name: Run tests
        run: make test

      - name: Enforce legacy retirement boundary
        shell: bash
        run: |
          set -euo pipefail
          test ! -d cmd/xbctl
          legacy_xboard_artifact="xboard-node""-linux-"
          legacy_xbctl_artifact="xbctl""-linux-"
          legacy_docker_alias="xboard-node"":latest"
          if grep -Fq "$legacy_xboard_artifact" Makefile .github/workflows/ci.yml; then
            echo "legacy xboard-node release artifact was reintroduced" >&2
            exit 1
          fi
          if grep -Fq "$legacy_xbctl_artifact" Makefile .github/workflows/ci.yml; then
            echo "legacy xbctl release artifact was reintroduced" >&2
            exit 1
          fi
          if grep -Fq "$legacy_docker_alias" Makefile Dockerfile; then
            echo "legacy xboard-node Docker alias was reintroduced" >&2
            exit 1
          fi
          grep -Fq 'CMD ["-c", "/etc/txnode/config.yml"]' Dockerfile

  container-config-path:
    name: Container config path compatibility
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Build runtime image
        run: docker build -t tx-node:config-path-ci .

      - name: Verify canonical image command
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect tx-node:config-path-ci --format '{{json .Config.Cmd}}')" = '["-c","/etc/txnode/config.yml"]'

      - name: Verify old Compose mount fallback
        shell: bash
        run: |
          set -euo pipefail
          legacy_cfg="$(mktemp)"
          printf 'invalid: [\n' > "$legacy_cfg"
          output="$(docker run --rm -v "$legacy_cfg:/etc/xboard-node/config.yml:ro" tx-node:config-path-ci 2>&1 || true)"
          printf '%s\n' "$output"
          grep -Fq 'using legacy container config path /etc/xboard-node/config.yml' <<<"$output"

      - name: Verify canonical path wins
        shell: bash
        run: |
          set -euo pipefail
          canonical_cfg="$(mktemp)"
          legacy_cfg="$(mktemp)"
          printf 'invalid: [\n' > "$canonical_cfg"
          printf 'invalid: [\n' > "$legacy_cfg"
          output="$(docker run --rm \
            -v "$canonical_cfg:/etc/txnode/config.yml:ro" \
            -v "$legacy_cfg:/etc/xboard-node/config.yml:ro" \
            tx-node:config-path-ci 2>&1 || true)"
          printf '%s\n' "$output"
          if grep -Fq 'using legacy container config path' <<<"$output"; then
            echo "legacy fallback won despite canonical config being mounted" >&2
            exit 1
          fi

  runtime-stability:
    name: Runtime stability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Stress extracted runtime controllers
        run: make test-runtime-stability

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, runtime-stability]
    # 手动从 main 构建测试版，或通过 v* 标签构建正式/候选版本
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}
        run: |
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            make build-linux
          else
            make build-linux-arm64
          fi

      - name: Upload tx-node artifact
        uses: actions/upload-artifact@v4
        with:
          name: tx-node-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tx-node-${{ matrix.goos }}-${{ matrix.goarch }}

  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, runtime-stability]
    # main 手动构建 :test；正式稳定版 vX.Y.Z 才允许更新 :latest
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase repo name (GHCR requires lowercase)
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          # GHA 构建缓存：QEMU arm64 编译第二次起显著提速；
          # mode=max 缓存所有构建阶段（含 go mod download / 编译中间层）
          cache-from: type=gha,scope=txnode
          cache-to: type=gha,mode=max,scope=txnode
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
            ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && format('ghcr.io/{0}:test', steps.repo.outputs.name) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/{0}:{1}', steps.repo.outputs.name, github.ref_name) || '' }}
            ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') && format('ghcr.io/{0}:latest', steps.repo.outputs.name) || '' }}

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, build-docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            dist/tx-node-linux-amd64
            dist/tx-node-linux-arm64
